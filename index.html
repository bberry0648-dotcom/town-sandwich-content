<!doctype html>
<html lang="ko">
<head>

<meta name="theme-color" content="#1f3a21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="잠실점 작업실">
<title>잠실점 후기 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>타운샌드위치 잠실점</b><span>후기 분석 · 콘텐츠 초안 작업실</span></div>
    <nav class="tabs" aria-label="화면">
      <button data-tab="summary"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h4v7H4zM10 4h4v16h-4zM16 9h4v11h-4z"/></svg>이번 주 요약</button>
      <button data-tab="items"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>수집 자료</button>
      <button data-tab="drafts"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg>초안</button>
      <button data-tab="store"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>매장·설정</button>
    </nav>
    <button class="btn on-dark" id="runBtn" type="button"><span class="long">지금 조회하고 초안 만들기</span><span class="short">조회·초안</span></button>
  </div>
</header>
<main id="app"><p class="empty">불러오는 중…</p></main>
<script>window.SHARE = true;</script>
<script src="app.js"></script>

</html>
